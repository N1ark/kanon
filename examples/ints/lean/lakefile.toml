name = "ints_example"
defaultTargets = ["IntsExample"]

# Kanon's Lean library, from this repository.
[[require]]
name = "kanon"
path = "../../../lean"

# A library has the files of a root, the hand-written ones (`R.+`) and the
# generated ones (`Generated.R.+`): Lake finds a module in the library of its
# root, and Kanon's library has its own `Generated/`.
[[lean_lib]]
name = "IntsExample"
globs = ["IntsExample.+", "Generated.IntsExample.+"]

# The int module (../int.kn), proved once for any language that uses it.
[[lean_lib]]
name = "IntMod"
globs = ["IntMod.+", "Generated.IntMod.+"]
