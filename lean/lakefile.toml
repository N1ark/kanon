name = "kanon"
defaultTargets = ["KanonCore", "KanonTest"]

# The Lean library of Kanon: what the generated proofs of every language need
# (KanonCore), the semantics and rule tactics shared by the languages
# (KanonCore.Proof, imported on its own), the rules of the bool module proved
# once for any language (KanonCore.BoolMod), and the generic core of terms, a
# trial (KanonCore.Lang).
[[lean_lib]]
name = "KanonCore"
roots = ["KanonCore", "KanonCore.Proof", "KanonCore.BoolMod", "KanonCore.Lang"]

# Regression tests of the tactics.
[[lean_lib]]
name = "KanonTest"
globs = ["KanonTest.+"]
