name = "kanon"
defaultTargets = ["KanonCore", "KanonBool", "KanonTest"]

# The Lean library of Kanon: what the generated proofs of every language need
# (KanonCore), the semantics and rule tactics shared by the languages
# (KanonCore.Proof, imported on its own), the interfaces of the modules proved
# once (KanonCore.Generic), and the generic core of terms, a trial
# (KanonCore.Lang).
[[lean_lib]]
name = "KanonCore"
roots = ["KanonCore", "KanonCore.Proof", "KanonCore.Generic", "KanonCore.Lang"]

# The bool module (modules/bool.kn), proved once for every language: its files
# are generated by `kanon lean-all . +bool.knl +bool.kn`, but for the hand-written
# ones (Val, Sem, Lib/, Proofs/).
[[lean_lib]]
name = "KanonBool"

# Regression tests of the tactics.
[[lean_lib]]
name = "KanonTest"
globs = ["KanonTest.+"]
