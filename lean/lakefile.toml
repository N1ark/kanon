name = "kanon"
defaultTargets = ["KanonCore"]

# The Lean library of Kanon: what the generated proofs of every language need
# (KanonCore), the semantics and rule tactics shared by the languages
# (KanonCore.Proof, imported on its own), and the generic core of terms, a
# trial (KanonCore.Lang).
[[lean_lib]]
name = "KanonCore"
roots = ["KanonCore", "KanonCore.Proof", "KanonCore.Lang"]
