name = "kanon"
defaultTargets = ["KanonCore", "KanonBool", "KanonTest"]

# The Lean library of Kanon: what the generated files of every module and
# language need (KanonCore), and the rule tactics (KanonCore.Proof, imported on
# its own).
[[lean_lib]]
name = "KanonCore"
roots = ["KanonCore", "KanonCore.Proof"]

# The bool module (modules/bool.kn), proved once for every language: its files
# are generated by `kanon lean . +bool.knl +bool.kn`, in Generated/KanonBool/,
# and the hand-written ones (Sem, Prims, Proofs) are in KanonBool/. The library
# has both: another package has its own Generated/ directory.
[[lean_lib]]
name = "KanonBool"
globs = ["KanonBool.+", "Generated.KanonBool.+"]

# Regression tests of the tactics.
[[lean_lib]]
name = "KanonTest"
globs = ["KanonTest.+"]
