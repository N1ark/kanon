name: Pages

# The site (site/): built on every pull request, where it is uploaded as an
# artifact to download, and built and deployed to GitHub Pages from main.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a deployment in progress finishes
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OCAML_VERSION: 5.5.0

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Install the dependencies of the web runtime
        run: |
          opam install . --deps-only -y
          opam install js_of_ocaml-compiler js_of_ocaml zarith_stubs_js -y

      - name: Build the web runtime, _build/default/web/dist
        run: opam exec -- dune build @web --profile web

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the dependencies of the site
        working-directory: site
        run: npm ci

      - name: Build the tree-sitter grammar to WebAssembly (in docker)
        working-directory: site
        run: npm run grammar

      - name: Build the site
        working-directory: site
        run: npm run build

      - name: Upload the site, to download from the run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site
          path: site/dist

      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
