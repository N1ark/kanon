name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OCAML_VERSION: 5.5.0

jobs:
  ocaml:
    name: Build, test and check the formatting of kanon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Install the dependencies
        run: opam install . --deps-only --with-test --with-dev-setup -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune test

      - name: Check the formatting
        run: opam exec -- dune build @fmt

  lean:
    name: Check the Lean library and the example language
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build
        run: lake build

      - name: Build the proofs of the example language
        working-directory: examples/bool/lean
        run: lake build

      - name: Check that no proof of the example language is missing
        working-directory: examples/bool/lean
        run: |
          lake env lean check_axioms.lean | tee axioms.txt
          if grep -q sorryAx axioms.txt; then
            echo "::error::Some rules of examples/bool are not proved"
            exit 1
          fi

  editors:
    name: Check the tree-sitter grammar and the Zed extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tree-sitter-kanon
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install the tree-sitter CLI
        run: npm install --no-save

      - name: Check that the generated parser is up to date
        run: |
          npx tree-sitter generate
          if ! git diff --exit-code -- src; then
            echo "::error::src/ is out of date: run tree-sitter generate in tree-sitter-kanon"
            exit 1
          fi

      - name: Test the grammar and the highlighting
        run: npx tree-sitter test

      - name: Parse the Kanon files of the repository without errors
        run: git ls-files -z -- ':/*.kn' ':/*.knl' | xargs -0 npx tree-sitter parse --quiet --stat

      - name: Check the queries of the Zed extension
        run: |
          for q in ../editors/zed/languages/kanon/*.scm; do
            npx tree-sitter query "$q" ../modules/bool.kn > /dev/null
          done

      - name: Check that the Zed extension uses the grammar of this commit
        run: |
          rev=$(sed -n 's/^rev = "\(.*\)"/\1/p' ../editors/zed/extension.toml)
          git fetch --quiet --depth=1 origin "$rev"
          if ! git diff --exit-code "$rev" HEAD -- grammar.js src; then
            echo "::error::The grammar changed: update rev in editors/zed/extension.toml to a commit with this grammar"
            exit 1
          fi
