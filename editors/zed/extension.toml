id = "kanon"
name = "Kanon"
description = "Support for Kanon, the rule language of verified smart constructors (.kn and .knl files)"
version = "0.1.0"
schema_version = 1
authors = ["N1ark"]
repository = "https://github.com/N1ark/kanon"
snippets = "snippets/kanon.json"

# `kanon lsp`, found by src/lib.rs: the binary is not bundled.
[language_servers.kanon]
name = "Kanon"
languages = ["Kanon"]

# The grammar lives in this repository, in tree-sitter-kanon/. `rev` is a commit
# that has its current version: bump it whenever the grammar changes (CI checks
# that the grammar at `rev` is the one of the checkout).
[grammars.kanon]
repository = "https://github.com/N1ark/kanon"
rev = "1d1a764e3eb291f7538ba34b6208b6622bd38b38"
path = "tree-sitter-kanon"
